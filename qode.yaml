qode_version: 0.4.0-beta
review:
  min_code_score: 10
  min_security_score: 10
scoring:
  strict: true
agents:
  cursor:
    enabled: true
  claude_code:
    enabled: true
  codex:
    enabled: true
  opencode:
    enabled: true # .opencode/commands/*.md
knowledge:
  path: .qode/knowledge
diff:
  command: git diff --merge-base origin/HEAD -- :(exclude).qode/
